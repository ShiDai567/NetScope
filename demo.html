<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Packet Flow - Demo</title>
    <style>
        body { margin: 0; padding: 0; background-color: #040f23; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff; overflow: hidden; }
        #map-container { width: 100vw; height: 100vh; }
        .panel { position: absolute; top: 20px; left: 20px; background: rgba(10, 25, 47, 0.85); border: 1px solid #1f4068; padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); backdrop-filter: blur(5px); z-index: 10; }
        .panel h2 { margin: 0 0 15px 0; font-size: 18px; color: #64ffda; text-transform: uppercase; letter-spacing: 1px; }
        .stats { display: flex; gap: 20px; margin-bottom: 20px; }
        .stat-item { display: flex; flex-direction: column; }
        .stat-label { font-size: 12px; color: #8892b0; }
        .stat-value { font-size: 24px; font-weight: bold; color: #ccd6f6; }
        .btn { background: #64ffda; color: #0a192f; border: none; padding: 10px 20px; font-size: 14px; font-weight: bold; border-radius: 4px; cursor: pointer; transition: all 0.3s ease; }
        .btn:hover { background: #52e0c4; box-shadow: 0 0 10px rgba(100, 255, 218, 0.5); }
        .legend { margin-top: 15px; font-size: 12px; color: #8892b0; }
        .legend span { display: inline-block; margin-right: 10px; }
        .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
    </style>
</head>
<body>

    <div class="panel">
        <h2>Network Flow Stats</h2>
        <div class="stats">
            <div class="stat-item">
                <span class="stat-label">Total Sent</span>
                <span class="stat-value" id="stat-total">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Success</span>
                <span class="stat-value" id="stat-success" style="color: #00ff88;">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Loss Rate</span>
                <span class="stat-value" id="stat-loss" style="color: #ff3366;">0%</span>
            </div>
        </div>
        <button class="btn" onclick="sendPacket()">Send Random Packet</button>
        
        <div class="legend">
            <span><i class="dot" style="background: #00ff88; box-shadow: 0 0 8px #00ff88;"></i>Success</span>
            <span><i class="dot" style="background: #ffcc00; box-shadow: 0 0 8px #ffcc00;"></i>High Latency</span>
            <span><i class="dot" style="background: #ff3366; box-shadow: 0 0 8px #ff3366;"></i>Dropped</span>
        </div>
    </div>

    <div id="map-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@4.9.0/map/js/world.js"></script>

    <script>
        const chart = echarts.init(document.getElementById('map-container'));

        // 节点数据 (类别A: 服务器, 类别B: 客户端)
        const nodes = {
            'Server-US': { name: 'Server (Silicon Valley)', coord: [-121.88, 37.33], ip: '8.8.8.8' },
            'Client-CN': { name: 'Client (Beijing)', coord: [116.40, 39.90], ip: '192.168.1.10' },
            'Client-EU': { name: 'Client (London)', coord: [-0.12, 51.50], ip: '192.168.1.20' },
            'Client-BR': { name: 'Client (São Paulo)', coord: [-46.63, -23.55], ip: '192.168.1.30' }
        };

        // 状态变量
        let stats = { total: 0, success: 0, dropped: 0 };
        let activeLines = [];

        // 基础地图配置 (科幻风格)
        const option = {
            backgroundColor: '#040f23',
            tooltip: {
                trigger: 'item',
                backgroundColor: 'rgba(10, 25, 47, 0.9)',
                borderColor: '#64ffda',
                textStyle: { color: '#ccd6f6' },
                formatter: function (params) {
                    if (params.seriesType === 'lines') {
                        const data = params.data.packetData;
                        return `
                            <div style="padding: 5px;">
                                <strong style="color:#64ffda;">Packet ID: ${data.id}</strong><br/>
                                <hr style="border-color:#1f4068; margin: 5px 0;">
                                📍 Source IP: ${data.source}<br/>
                                🎯 Dest IP: ${data.destination}<br/>
                                📦 Protocol: <b>${data.protocol}</b><br/>
                                📊 Size: ${data.size} bytes<br/>
                                🚥 Status: ${data.status.toUpperCase()}<br/>
                                ⏱️ Time: ${new Date(data.timestamp * 1000).toLocaleTimeString()}
                            </div>
                        `;
                    }
                    return params.name;
                }
            },
            geo: {
                map: 'world',
                roam: true,
                zoom: 1.2,
                itemStyle: {
                    areaColor: '#0a192f',
                    borderColor: '#1f4068',
                    borderWidth: 1
                },
                emphasis: {
                    itemStyle: { areaColor: '#112240' },
                    label: { show: false }
                }
            },
            series: [
                // 渲染节点
                {
                    type: 'effectScatter',
                    coordinateSystem: 'geo',
                    zlevel: 2,
                    rippleEffect: { brushType: 'stroke', scale: 3 },
                    label: { show: true, position: 'right', formatter: '{b}', color: '#8892b0' },
                    symbolSize: 8,
                    itemStyle: { color: '#64ffda' },
                    data: Object.values(nodes).map(n => ({ name: n.name, value: [...n.coord, n.ip] }))
                },
                // 渲染飞线 (数据包)
                {
                    type: 'lines',
                    coordinateSystem: 'geo',
                    zlevel: 3,
                    effect: { show: true, period: 3, trailLength: 0.3, symbol: 'circle', symbolSize: 6 },
                    lineStyle: { color: '#00ff88', width: 1, opacity: 0.2, curveness: 0.3 },
                    data: []
                }
            ]
        };
        chart.setOption(option);

        // 发送数据包逻辑
        function sendPacket() {
            stats.total++;
            
            const clients = ['Client-CN', 'Client-EU', 'Client-BR'];
            const targetClient = nodes[clients[Math.floor(Math.random() * clients.length)]];
            const server = nodes['Server-US'];
            
            // 随机生成状态和协议
            const statuses = ['success', 'success', 'success', 'delayed', 'dropped']; // 60%成功, 20%延迟, 20%丢包
            const protocols = ['TCP', 'UDP', 'ICMP'];
            
            const status = statuses[Math.floor(Math.random() * statuses.length)];
            const protocol = protocols[Math.floor(Math.random() * protocols.length)];
            
            if (status === 'success') stats.success++;
            if (status === 'dropped') stats.dropped++;
            updateStats();

            // 构造符合你要求的 JSON 结构
            const packetJSON = {
                id: `pkt_${String(stats.total).padStart(3, '0')}`,
                source: targetClient.ip,
                destination: server.ip,
                protocol: protocol,
                status: status,
                size: Math.floor(Math.random() * 1500) + 64,
                timestamp: Math.floor(Date.now() / 1000)
            };

            // 根据状态决定颜色和动画
            let color = '#00ff88'; // success
            let period = 3; // 正常速度
            let destCoord = server.coord;

            if (status === 'delayed') {
                color = '#ffcc00';
                period = 8; // 延迟导致速度变慢
            } else if (status === 'dropped') {
                color = '#ff3366';
                // 丢包：目标坐标计算到一半，模拟半路消失
                destCoord = [
                    (targetClient.coord[0] + server.coord[0]) / 2,
                    (targetClient.coord[1] + server.coord[1]) / 2
                ];
            }

            const newLine = {
                coords: [targetClient.coord, destCoord],
                packetData: packetJSON,
                lineStyle: { color: color },
                effect: { period: period, color: color }
            };

            activeLines.push(newLine);
            
            // 保持画面不过载，保留最近的 20 条线
            if (activeLines.length > 20) activeLines.shift();

            // 更新 ECharts 数据
            chart.setOption({
                series: [{}, { data: activeLines }]
            });
        }

        // 更新左上角统计面板
        function updateStats() {
            document.getElementById('stat-total').innerText = stats.total;
            document.getElementById('stat-success').innerText = stats.success;
            const lossRate = stats.total === 0 ? 0 : ((stats.dropped / stats.total) * 100).toFixed(1);
            document.getElementById('stat-loss').innerText = lossRate + '%';
        }

        // 监听窗口缩放自适应
        window.addEventListener('resize', () => chart.resize());
    </script>
</body>
</html>
